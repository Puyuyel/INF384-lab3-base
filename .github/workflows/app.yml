name: app

# Pipeline de aplicacion. Es dueno de la imagen que ejecuta la funcion y no
# toca la infraestructura.
#
# De las cuatro gates, solo `secretos` detiene el pipeline. Las otras
# tres informan y dejan pasar: el hallazgo tiene que quedar visible en la
# ejecucion, no enterrado en el log.
#
# El repositorio no tiene archivo de excepciones. Un hallazgo que se decida
# no corregir se anota donde se produce: junto a la linea de codigo que lo
# origina, o en el paso del pipeline que lo detecta cuando el hallazgo no
# corresponde a ninguna linea. La anotacion lleva identificador del hallazgo,
# razon, responsable y fecha de vencimiento. Las cuatro, siempre.
#
# En los jobs sin implementar, preferir una action del marketplace o la
# imagen oficial de la herramienta antes que instalarla paso a paso en el
# runner. La guia del laboratorio lista las referencias disponibles.

permissions:
  contents: read
  pull-requests: write

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'infra/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'infra/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  # Publicar el analisis de calidad y la cobertura en SonarQube Cloud, como
  # en el Laboratorio 2.
  #
  # La configuracion del analisis viene resuelta en sonar-project.properties
  # y no hay que editarla. Lo que falta es el ensamblaje: las credenciales,
  # la cobertura y el analisis del historial.
  #
  # El reporte de cobertura lo produce el job pruebas.
  # El analisis necesita el historial completo del repositorio para saber
  # que es codigo nuevo.
  #
  # Esta compuerta no detiene el pipeline: el resultado queda en SonarQube
  # Cloud y se lee ahi.
  calidad:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar la cobertura generada
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage
        continue-on-error: true

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_ORG: ${{ vars.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        continue-on-error: true

      - name: Mostrar resultado visible en la ejecucion
        if: always()
        run: |
          echo "::warning::La compuerta de calidad queda como informativa; el resultado se ve en SonarQube Cloud."

  # Buscar credenciales escritas en el codigo y en el historial del repositorio.
  # El alcance incluye el historial completo, no solo el ultimo commit.
  #
  # Condicion de detencion: cualquier hallazgo. Esta es la unica compuerta
  # de este pipeline que detiene.
  #
  # Una credencial no se exceptua. Se retira del codigo, se retira del
  # historial y se rota en el origen. Silenciar el hallazgo deja la credencial
  # viva y ademas apaga el control para la proxima.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar credenciales con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Contrastar el arbol de dependencias declarado en package-lock.json contra
  # vulnerabilidades conocidas.
  #
  # El alcance es el arbol completo, no solo las dependencias de produccion.
  # El repositorio arrastra un hallazgo que solo aparece si el alcance es el
  # correcto: si el informe trae uno solo, el alcance esta mal.
  #
  # Esta compuerta no detiene el pipeline. El hallazgo no cuelga de ninguna
  # linea de codigo: la anotacion, si se decide no corregir, va en el paso
  # que lo detecta.
  dependencias:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Analizar vulnerabilidades del lockfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          scanners: vuln
        continue-on-error: true

      - name: Mostrar hallazgos visibles en la ejecucion
        if: always()
        run: |
          echo "::warning::La compuerta de dependencias es informativa; el hallazgo queda visible en la salida del paso."

  # Buscar patrones explotables en el codigo fuente.
  #
  # Esta compuerta no detiene el pipeline. El hallazgo cuelga de una linea
  # concreta: la anotacion, si se decide no corregir, va junto a esa linea.
  estatico:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Analizar el codigo fuente con Semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
              --config=p/default \
              --config=p/javascript \
              --json --quiet \
              --output=semgrep.json \
              src/

          python - <<'PY'
          import json
          from pathlib import Path

          out = Path('semgrep.json')
          if not out.exists():
              print('::warning::Semgrep no produjo resultados.')
              raise SystemExit(0)

          data = json.loads(out.read_text())
          findings = data.get('results', [])
          if not findings:
              print('Semgrep: sin hallazgos.')
              raise SystemExit(0)

          print(f'::warning::Semgrep encontró {len(findings)} hallazgos.')
          for item in findings[:10]:
              path = item.get('path', 'unknown')
              line = item.get('start', {}).get('line', '?')
              msg = item.get('extra', {}).get('message', 'Sin mensaje')
              print(f'::warning::{path}:{line} {msg}')
          PY

      - name: Resultado visible de la compuerta statica
        if: always()
        run: |
          echo "::warning::La compuerta estatica se reporta como informativa y queda visible en la ejecucion."

  # B1 · Validacion de sintaxis e integridad.
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate

  # B2 · Analisis de politicas.
  politicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analisis de configuracion de IaC con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

  # B3 · Plan y compuerta sobre el plan.
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform plan
        run: |
          terraform plan -out=tfplan
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > tfplan.txt

      - name: Publicar el plan en el pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tfplan.txt', 'utf8');
            const body = '## Plan de Terraform\n```hcl\n' + (plan.length > 20000 ? plan.slice(0, 20000) + '\n...truncado...' : plan) + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Subir artefactos del plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            infra/tfplan
            infra/tfplan.json
            infra/tfplan.txt
          if-no-files-found: error

  # B4 · Aplicacion.
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Aplicar plan guardado
        run: terraform apply -input=false tfplan

  # Construir la imagen de la aplicacion y publicarla en el registro privado.
  #
  # Depende de los cuatro jobs anteriores y corre solo desde la rama principal.
  #
  # La imagen se publica con dos tags independientes sobre el mismo manifiesto:
  # el sha corto del commit y el ambiente.
  #
  #   - El sha es el tag con el que se publica. Nace del commit, siempre
  #     existe y no se reasigna nunca.
  #   - El ambiente se reasigna en cada publicacion y siempre apunta a lo
  #     ultimo publicado para ese ambiente.
  #
  # La construccion es para linux/amd64 y declara el label
  # org.opencontainers.image.title con el nombre de la aplicacion.
  #
  # Condicion de detencion: cualquier fallo de construccion o de publicacion.
  #
  # El job desplegar consume la salida 'digest' de este job. El formato es
  # <registro>/<aplicacion>@sha256:... Exponer solo el sha del digest, o
  # nombrar la salida de otra manera, rompe el despliegue.
  publicar:
    needs: [pruebas, calidad, secretos, dependencias, estatico]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publicar.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secreto AWS_ACCOUNT_ID
        run: |
          if [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "::error::Falta el secreto AWS_ACCOUNT_ID. Debe contener el ID de la cuenta AWS (12 digitos) y no puede quedar vacio."
            exit 1
          fi

      - name: Configurar AWS para ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Iniciar sesion en ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Construir y publicar la imagen
        id: publicar
        env:
          REGISTRO: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
          IMAGEN: inf384-lab3
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG_SHA_SHORT="${SHA::7}"
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.title=${IMAGEN}" \
            --tag "${REGISTRO}/${IMAGEN}:${TAG_SHA_SHORT}" \
            --tag "${REGISTRO}/${IMAGEN}:prd" \
            .
          docker push "${REGISTRO}/${IMAGEN}:${TAG_SHA_SHORT}"
          docker push "${REGISTRO}/${IMAGEN}:prd"
          DIGEST="$(docker image inspect "${REGISTRO}/${IMAGEN}:${TAG_SHA_SHORT}" --format '{{index .RepoDigests 0}}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}"

  # Este job viene completo y no se modifica.
  # Las estrategias de despliegue y la verificacion posterior son contenido
  # de la sesion 6. La pregunta de reflexion 2 pide leerlo.
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Actualizar la funcion por digest
        run: |
          aws lambda update-function-code \
            --function-name inf384-lab3 \
            --image-uri ${{ needs.publicar.outputs.digest }}

      - name: Esperar a que la actualizacion termine
        run: aws lambda wait function-updated --function-name inf384-lab3
